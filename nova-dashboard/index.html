<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090c10">
  <meta name="description" content="Nova Dashboard — a focused personal workspace for tasks, notes, and time.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090c10'/%3E%3Cpath d='M32 10l5.8 16.2L54 32l-16.2 5.8L32 54l-5.8-16.2L10 32l16.2-5.8L32 10z' fill='%237cf7d4'/%3E%3C/svg%3E">
  <title>Nova Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="dashboard">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Nova Dashboard home">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Nova</span>
      </a>

      <div class="date-time" aria-live="off">
        <p id="current-date" class="current-date"></p>
        <time id="current-time" class="current-time"></time>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">PERSONAL DASHBOARD</p>
      <h1 id="page-title">Make space for what matters.</h1>
    </section>

    <div class="widget-grid">
      <section class="card tasks-card" aria-labelledby="tasks-title">
        <div class="card-heading">
          <div>
            <p class="card-kicker">PLANNING</p>
            <h2 id="tasks-title">To-do lists</h2>
          </div>
          <span id="task-count" class="count" aria-live="polite">0 tasks</span>
        </div>

        <div class="task-tabs" role="tablist" aria-label="To-do list period">
          <button id="daily-tab" class="task-tab active" type="button" role="tab" aria-selected="true" aria-controls="task-list" data-period="daily">Daily</button>
          <button id="weekly-tab" class="task-tab" type="button" role="tab" aria-selected="false" aria-controls="task-list" data-period="weekly">Weekly</button>
          <button id="monthly-tab" class="task-tab" type="button" role="tab" aria-selected="false" aria-controls="task-list" data-period="monthly">Monthly</button>
        </div>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input id="task-input" type="text" maxlength="120" placeholder="Add a daily task…" autocomplete="off" required>
          <button type="submit" aria-label="Add task">+</button>
        </form>

        <ul id="task-list" class="task-list" role="tabpanel" aria-labelledby="daily-tab" aria-label="Daily tasks"></ul>
        <p id="task-empty" class="empty-state">Nothing on your daily list yet.</p>
      </section>

      <section class="card timer-card" aria-labelledby="timer-title">
        <div class="card-heading">
          <div>
            <p class="card-kicker">FOCUS</p>
            <h2 id="timer-title">Timers</h2>
          </div>
          <span id="timer-count" class="count" aria-live="polite">1 timer</span>
        </div>

        <form id="timer-form" class="timer-form">
          <div class="timer-field timer-name-field">
            <label for="timer-name">Name</label>
            <input id="timer-name" type="text" maxlength="40" placeholder="Timer name" autocomplete="off" required>
          </div>
          <div class="timer-field timer-duration-field">
            <label for="timer-duration">Minutes</label>
            <input id="timer-duration" type="number" min="1" max="1440" step="1" value="25" inputmode="numeric" required>
          </div>
          <button class="timer-add" type="submit" aria-label="Create timer">+</button>
        </form>

        <div id="timer-list" class="timer-list" aria-label="Timers"></div>
        <p id="timer-empty" class="empty-state hidden">Create a timer to get started.</p>
      </section>

      <section class="card notes-card" aria-labelledby="notes-title">
        <div class="card-heading">
          <div>
            <p class="card-kicker">QUICK CAPTURE</p>
            <h2 id="notes-title">Notes</h2>
          </div>
          <span id="notes-status" class="save-status" aria-live="polite">Saved locally</span>
        </div>

        <label class="sr-only" for="notes-input">Personal notes</label>
        <textarea id="notes-input" maxlength="5000" placeholder="Write down a thought…"></textarea>
      </section>
    </div>
  </main>
</body>
</html>
